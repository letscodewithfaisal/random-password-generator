<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Password Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="password-container">
      <h2 class="h2">Random Password Generator</h2>
      <div class="input-container">
        <input
          type="text"
          id="input"
          class="input"
          placeholder="Create Password"
          readonly
        />
        
        <i class="far fa-copy fa-2x" aria-label="Copy password"></i>
      </div>
       <button class="btn">Generate</button>
            <div class="options">
        <label class="length-label">
          Length: <span id="length-value">14</span>
          <input type="range" id="length" min="4" max="32" value="14" />
        </label>
        <label><input type="checkbox" id="lower" checked /> Lowercase</label>
        <label><input type="checkbox" id="upper" checked /> Uppercase</label>
        <label><input type="checkbox" id="numbers" checked /> Numbers</label>
        <label><input type="checkbox" id="symbols" checked /> Symbols</label>
      </div>

      <div class="strength">
        <div class="strength-bar">
          <div class="strength-fill"></div>
        </div>
        <span class="strength-text"></span>
      </div>
      </div>

    <!-- add button Here -->
    </div>
    <div class="alert-container active">Password Copied</div>
    <script src="index.js"></script>
  </body>
</html>
